<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="ytcp — YouTube MCP Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#141a23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff003c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.18" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#ff003c" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff003c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.85" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2030" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="340" fill="url(#glowRed)"/>
  <rect width="1200" height="340" fill="url(#glowPurple)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="340" fill="url(#accent)"/>

  <!-- Logo mark: rounded play button -->
  <g transform="translate(78, 110)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="#ff003c"/>
    <rect x="0" y="0" width="92" height="92" rx="22" fill="url(#accent)" opacity="0.55"/>
    <polygon points="36,26 36,66 70,46" fill="#ffffff"/>
    <rect x="0" y="0" width="92" height="92" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="92" fill="#ffffff" letter-spacing="-3">ytcp</text>

  <!-- Subtitle eyebrow -->
  <text x="204" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" font-size="18" fill="#8b949e" letter-spacing="6">YOUTUBE  ·  MCP  ·  SERVER</text>

  <!-- Tagline -->
  <text x="204" y="248" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" font-size="20" fill="#c9d1d9">Bring YouTube into Claude. No API key. No quotas. Just plug in.</text>

  <!-- Pill badges row -->
  <g transform="translate(204, 270)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    <g>
      <rect x="0" y="0" width="118" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
      <circle cx="14" cy="14" r="3.5" fill="#3fb950"/>
      <text x="26" y="18" fill="#c9d1d9">No API key</text>
    </g>
    <g transform="translate(128, 0)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
      <circle cx="14" cy="14" r="3.5" fill="#58a6ff"/>
      <text x="26" y="18" fill="#c9d1d9">TypeScript</text>
    </g>
    <g transform="translate(248, 0)">
      <rect x="0" y="0" width="108" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
      <circle cx="14" cy="14" r="3.5" fill="#7c3aed"/>
      <text x="26" y="18" fill="#c9d1d9">MCP 1.26</text>
    </g>
    <g transform="translate(366, 0)">
      <rect x="0" y="0" width="106" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
      <circle cx="14" cy="14" r="3.5" fill="#ff003c"/>
      <text x="26" y="18" fill="#c9d1d9">Node 18+</text>
    </g>
  </g>

  <!-- Right side: network visualization -->
  <g transform="translate(760, 60)">
    <!-- Frame -->
    <rect x="0" y="0" width="380" height="240" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="30" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="#6e7681">// architecture.preview</text>

    <!-- Connections (drawn first so nodes overlay) -->
    <g stroke="#30363d" stroke-width="1.5" fill="none">
      <path d="M 70 90 Q 130 90 175 130"/>
      <path d="M 70 170 Q 130 170 175 130"/>
      <path d="M 70 130 L 175 130"/>
      <path d="M 235 130 L 310 90"/>
      <path d="M 235 130 L 310 130"/>
      <path d="M 235 130 L 310 170"/>
    </g>

    <!-- Pulse dots on lines -->
    <g fill="#ff003c">
      <circle cx="130" cy="105" r="2.5" opacity="0.9"/>
      <circle cx="130" cy="155" r="2.5" opacity="0.5"/>
      <circle cx="270" cy="105" r="2.5" opacity="0.7"/>
      <circle cx="270" cy="155" r="2.5" opacity="0.9"/>
    </g>

    <!-- Client nodes (left) -->
    <g font-family="system-ui, sans-serif" font-size="10" font-weight="600">
      <g transform="translate(20, 75)">
        <rect width="50" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="25" y="19" text-anchor="middle" fill="#c9d1d9">Claude</text>
      </g>
      <g transform="translate(20, 115)">
        <rect width="50" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="25" y="19" text-anchor="middle" fill="#c9d1d9">IDE</text>
      </g>
      <g transform="translate(20, 155)">
        <rect width="50" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="25" y="19" text-anchor="middle" fill="#c9d1d9">CLI</text>
      </g>
    </g>

    <!-- Central node ytcp -->
    <g transform="translate(175, 105)">
      <rect width="60" height="50" rx="10" fill="#161b22" stroke="#ff003c" stroke-width="1.5"/>
      <text x="30" y="22" text-anchor="middle" font-family="ui-monospace, SF Mono, monospace" font-size="11" font-weight="700" fill="#ffffff">ytcp</text>
      <text x="30" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#8b949e">MCP server</text>
    </g>

    <!-- YouTube data nodes (right) -->
    <g font-family="system-ui, sans-serif" font-size="10" font-weight="600">
      <g transform="translate(310, 75)">
        <rect width="50" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="25" y="19" text-anchor="middle" fill="#c9d1d9">Videos</text>
      </g>
      <g transform="translate(310, 115)">
        <rect width="50" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="25" y="19" text-anchor="middle" fill="#c9d1d9">Captions</text>
      </g>
      <g transform="translate(310, 155)">
        <rect width="50" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="25" y="19" text-anchor="middle" fill="#c9d1d9">Channels</text>
      </g>
    </g>

    <text x="190" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6e7681">one server · two transports · seven tools</text>
  </g>
</svg>
