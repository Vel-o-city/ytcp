<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="The seven ytcp tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#141a23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff003c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2733"/>
    </pattern>

    <!-- Reusable card style -->
    <symbol id="card" viewBox="0 0 270 220">
      <rect x="0" y="0" width="270" height="220" rx="14" fill="#0d1117" stroke="#30363d"/>
      <rect x="0" y="0" width="270" height="3" rx="1" fill="url(#accent)" opacity="0.6"/>
    </symbol>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#dot)" opacity="0.6"/>

  <!-- Header -->
  <text x="60" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="26" fill="#ffffff">Seven tools. Zero configuration.</text>
  <text x="60" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">Every tool registered through the MCP server with strict Zod schemas and read-only annotations.</text>
  <rect x="60" y="92" width="60" height="3" rx="1" fill="url(#accent)"/>

  <!-- Row 1 -->
  <!-- Card 1: search_videos -->
  <g transform="translate(60, 120)">
    <use href="#card"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <circle cx="17" cy="17" r="7" fill="none" stroke="#ff003c" stroke-width="2"/>
      <line x1="22" y1="22" x2="29" y2="29" stroke="#ff003c" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">search_videos</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Query YouTube with filters and pagination —</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">no quota, no key.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">uploadDate · duration · sortBy</text>
      <text x="22" y="174">features: hd, 4k, subtitles, …</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">→ up to 10 results + nextPageToken</text>
  </g>

  <!-- Card 2: get_video_details -->
  <g transform="translate(347, 120)">
    <use href="#card"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <rect x="9" y="11" width="22" height="18" rx="3" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <polygon points="17,17 17,23 23,20" fill="#7c3aed"/>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">get_video_details</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Full metadata for any public video —</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">URL or bare 11-char ID.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">title · description · chapters</text>
      <text x="22" y="174">duration · views · likes · thumbs</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">→ structured video record</text>
  </g>

  <!-- Card 3: get_transcript -->
  <g transform="translate(634, 120)">
    <use href="#card"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <g stroke="#58a6ff" stroke-width="2" stroke-linecap="round">
        <line x1="11" y1="14" x2="29" y2="14"/>
        <line x1="11" y1="20" x2="29" y2="20"/>
        <line x1="11" y1="26" x2="22" y2="26"/>
      </g>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">get_transcript</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Spoken-content extraction with dual-route</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">fallback. Multi-language. Timestamped.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">language · includeTimestamps</text>
      <text x="22" y="174">primary + InnerTube fallback</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">→ text + segments + languages</text>
  </g>

  <!-- Card 4: get_comments -->
  <g transform="translate(921, 120)">
    <use href="#card"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <path d="M 10 14 L 30 14 L 30 24 L 20 24 L 16 28 L 16 24 L 10 24 Z" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">get_comments</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Top-level comment threads with</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">authorship, likes, and pin status.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">sortBy: top_comments | new</text>
      <text x="22" y="174">paginated, up to 50 / page</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">→ threads + nextPageToken</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 5: get_playlist -->
  <g transform="translate(60, 366)">
    <use href="#card"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <g fill="#ff9d3c">
        <circle cx="13" cy="14" r="2"/>
        <circle cx="13" cy="20" r="2"/>
        <circle cx="13" cy="26" r="2"/>
      </g>
      <g stroke="#ff9d3c" stroke-width="2" stroke-linecap="round">
        <line x1="19" y1="14" x2="30" y2="14"/>
        <line x1="19" y1="20" x2="30" y2="20"/>
        <line x1="19" y1="26" x2="30" y2="26"/>
      </g>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">get_playlist</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Walk a playlist with video metadata,</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">positions, and playability flags.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">accepts URL · watch?list= · ID</text>
      <text x="22" y="174">25 items per page</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">→ items + nextPageToken</text>
  </g>

  <!-- Card 6: get_channel -->
  <g transform="translate(347, 366)">
    <use href="#card"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="16" r="4" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <path d="M 11 30 Q 20 22 29 30" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">get_channel</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Channel overview plus recent uploads,</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">with a search-based fallback for handles.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">@handle · channelId · URL</text>
      <text x="22" y="174">subs · views · video count</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">→ channel + recentVideos[ ]</text>
  </g>

  <!-- Card 7: server_status -->
  <g transform="translate(634, 366)">
    <use href="#card"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <path d="M 8 20 L 14 20 L 17 14 L 20 26 L 23 18 L 26 20 L 32 20" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">server_status</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Confirm the server is alive and which</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">transports are active in this build.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">no input</text>
      <text x="22" y="174">also: HTTP /health endpoint</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">→ {"version", "transports[]"}</text>
  </g>

  <!-- Card 8: Resources + Prompts (bonus / meta) -->
  <g transform="translate(921, 366)">
    <rect x="0" y="0" width="270" height="220" rx="14" fill="#0d1117" stroke="url(#accent)" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="3" rx="1" fill="url(#accent)"/>
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
      <rect x="11" y="11" width="8" height="8" rx="1.5" fill="#ff003c"/>
      <rect x="21" y="11" width="8" height="8" rx="1.5" fill="#7c3aed"/>
      <rect x="11" y="21" width="8" height="8" rx="1.5" fill="#58a6ff"/>
      <rect x="21" y="21" width="8" height="8" rx="1.5" fill="#3fb950"/>
    </g>
    <text x="22" y="92" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3">+ resources &amp; prompts</text>
    <text x="22" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">For clients that prefer the resource</text>
    <text x="22" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">interface or guided prompts.</text>
    <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#6e7681">
      <text x="22" y="158">youtube://video/{id} (+2)</text>
      <text x="22" y="174">extract_transcript_workflow (+1)</text>
    </g>
    <rect x="22" y="186" width="226" height="20" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#c9d1d9">3 templates  ·  2 prompt builders</text>
  </g>

  <!-- Footer hint -->
  <g transform="translate(60, 624)">
    <rect width="1080" height="68" rx="12" fill="#0d1117" stroke="#30363d"/>
    <g transform="translate(20, 18)">
      <text font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">EVERY  TOOL  IS</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">
      <g transform="translate(160, 30)">
        <circle cx="6" cy="0" r="3" fill="#3fb950"/>
        <text x="18" y="4">Read-only annotated</text>
      </g>
      <g transform="translate(360, 30)">
        <circle cx="6" cy="0" r="3" fill="#3fb950"/>
        <text x="18" y="4">Zod-validated inputs</text>
      </g>
      <g transform="translate(560, 30)">
        <circle cx="6" cy="0" r="3" fill="#3fb950"/>
        <text x="18" y="4">Cached &amp; coalesced</text>
      </g>
      <g transform="translate(760, 30)">
        <circle cx="6" cy="0" r="3" fill="#3fb950"/>
        <text x="18" y="4">Unit-tested</text>
      </g>
      <g transform="translate(920, 30)">
        <circle cx="6" cy="0" r="3" fill="#3fb950"/>
        <text x="18" y="4">DI-friendly</text>
      </g>
    </g>
  </g>
</svg>
