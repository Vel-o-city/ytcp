<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="ytcp system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#141a23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff003c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2733"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff003c"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#dot)" opacity="0.6"/>

  <!-- Header -->
  <text x="60" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="26" fill="#ffffff">System architecture</text>
  <text x="60" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#8b949e">Layered design — every layer is independently testable and swappable.</text>
  <rect x="60" y="92" width="60" height="3" rx="1" fill="url(#accent)"/>

  <!-- ===== Layer 1: Clients ===== -->
  <g transform="translate(60, 120)">
    <text font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="#6e7681" letter-spacing="1">01  CLIENTS</text>
    <rect x="0" y="14" width="1080" height="80" rx="12" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>

    <g transform="translate(20, 30)">
      <rect width="240" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="25" r="8" fill="#ff003c"/>
      <text x="40" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e6edf3">Claude Desktop</text>
      <text x="40" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">stdio config in claude_desktop_config.json</text>
    </g>

    <g transform="translate(280, 30)">
      <rect width="240" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="25" r="8" fill="#58a6ff"/>
      <text x="40" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e6edf3">Claude Code / IDE</text>
      <text x="40" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">stdio or remote HTTP endpoint</text>
    </g>

    <g transform="translate(540, 30)">
      <rect width="240" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="25" r="8" fill="#7c3aed"/>
      <text x="40" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e6edf3">Any MCP client</text>
      <text x="40" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Streamable HTTP transport</text>
    </g>

    <g transform="translate(800, 30)">
      <rect width="240" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="25" r="8" fill="#3fb950"/>
      <text x="40" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e6edf3">Verifier harness</text>
      <text x="40" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">npm run live:verify</text>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="234" x2="600" y2="258" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 2: Transports ===== -->
  <g transform="translate(60, 260)">
    <text font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="#6e7681" letter-spacing="1">02  TRANSPORTS</text>
    <rect x="0" y="14" width="1080" height="86" rx="12" fill="#0d1117" stroke="#30363d"/>

    <g transform="translate(20, 32)">
      <rect width="510" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
      <rect x="0" y="0" width="4" height="54" rx="2" fill="#58a6ff"/>
      <text x="20" y="22" font-family="ui-monospace, SF Mono, monospace" font-size="13" font-weight="700" fill="#e6edf3">stdio</text>
      <text x="20" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Local subprocess transport · zero network surface · best for desktop clients</text>
    </g>

    <g transform="translate(550, 32)">
      <rect width="510" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
      <rect x="0" y="0" width="4" height="54" rx="2" fill="#7c3aed"/>
      <text x="20" y="22" font-family="ui-monospace, SF Mono, monospace" font-size="13" font-weight="700" fill="#e6edf3">Streamable HTTP</text>
      <text x="20" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Per-IP rate limit · isolated sessions · /health endpoint · reverse-proxy friendly</text>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="380" x2="600" y2="404" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 3: MCP Server core ===== -->
  <g transform="translate(60, 406)">
    <text font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="#6e7681" letter-spacing="1">03  MCP SERVER CORE</text>
    <rect x="0" y="14" width="1080" height="106" rx="12" fill="#0d1117" stroke="url(#accent)" stroke-width="1.5"/>

    <g transform="translate(20, 34)">
      <rect width="340" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e6edf3">Tools  ·  7</text>
      <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#8b949e">
        <text x="20" y="42">search_videos  ·  get_video_details</text>
        <text x="20" y="56">get_transcript  ·  get_comments</text>
        <text x="20" y="70">get_playlist  ·  get_channel  ·  server_status</text>
      </g>
    </g>

    <g transform="translate(380, 34)">
      <rect width="340" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e6edf3">Resources  ·  3 templates</text>
      <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#8b949e">
        <text x="20" y="42">youtube://video/{videoId}</text>
        <text x="20" y="56">youtube://transcript/{videoId}</text>
        <text x="20" y="70">youtube://channel/{channelId}</text>
      </g>
    </g>

    <g transform="translate(740, 34)">
      <rect width="320" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e6edf3">Prompts  ·  2 reusable</text>
      <g font-family="ui-monospace, SF Mono, monospace" font-size="10" fill="#8b949e">
        <text x="20" y="42">extract_transcript_workflow</text>
        <text x="20" y="56">analyze_video</text>
        <text x="20" y="70" fill="#6e7681">structured guidance for the agent</text>
      </g>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="546" x2="600" y2="570" stroke="#ff003c" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ===== Layer 4: YouTube service ===== -->
  <g transform="translate(60, 572)">
    <text font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="#6e7681" letter-spacing="1">04  YOUTUBE SERVICE LAYER</text>
    <rect x="0" y="14" width="1080" height="94" rx="12" fill="#0d1117" stroke="#30363d"/>

    <g transform="translate(20, 32)">
      <rect width="250" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#e6edf3">Parser</text>
      <text x="20" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">URL · ID · handle</text>
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">→ typed reference</text>
    </g>

    <g transform="translate(280, 32)">
      <rect width="250" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#e6edf3">Coalescing cache</text>
      <text x="20" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Per-resource TTLs</text>
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">In-flight dedup</text>
    </g>

    <g transform="translate(540, 32)">
      <rect width="250" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#e6edf3">Request policy</text>
      <text x="20" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Retry · backoff</text>
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Error normalization</text>
    </g>

    <g transform="translate(800, 32)">
      <rect width="260" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#e6edf3">Transcript fallback</text>
      <text x="20" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">InnerTube /player route</text>
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Used when primary 400s</text>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="688" x2="600" y2="712" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 5: YouTube ===== -->
  <g transform="translate(60, 714)">
    <rect x="0" y="0" width="1080" height="36" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="22" cy="18" r="6" fill="#ff003c"/>
    <text x="40" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#e6edf3">YouTube  ·  InnerTube</text>
    <text x="225" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Reverse-engineered web API via youtubei.js  ·  no Data API key required</text>
  </g>
</svg>
